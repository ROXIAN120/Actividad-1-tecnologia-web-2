name: tw2-tarea-9
services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_DATABASE: apicultores
      MYSQL_USER: apicultores
      MYSQL_PASSWORD: miel2026
      MYSQL_ROOT_PASSWORD: raiz2026
      TZ: America/La_Paz
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - datos_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  datos_mysql:
