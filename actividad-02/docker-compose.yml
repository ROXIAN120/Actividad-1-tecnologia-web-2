name: tw2-actividad02-final
services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3309:3306"
    environment:
      MYSQL_DATABASE: ${BD_NOMBRE:?Ejecutar php configurar.php}
      MYSQL_USER: ${BD_USUARIO:?Falta usuario local}
      MYSQL_PASSWORD: ${BD_CLAVE:?Falta clave local}
      MYSQL_ROOT_PASSWORD: ${BD_ROOT_CLAVE:?Falta clave root local}
      TZ: America/La_Paz
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - mysql_actividad02:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  mysql_actividad02:
